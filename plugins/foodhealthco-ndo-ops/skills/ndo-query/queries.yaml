# Query catalog for the ndo-query skill.
#
# Every query here runs against the `dietitian` view schema on the `ndo`
# database, as the operator's own IAM identity, in a read-only session.
# The schema's grants are the security boundary — this catalog is the UX.
#
# Conventions:
#   - All table references are schema-qualified (dietitian.*) even though the
#     runner also sets search_path=dietitian.
#   - Parameters are ALWAYS bound (%(name)s) — never interpolated. int_list
#     params bind as Postgres arrays via `= ANY(%(ids)s)`.
#   - Optional string filters use the '' sentinel: (%(x)s = '' OR col = %(x)s).
#   - Every row-returning query has a LIMIT (bound, max-clamped by the runner).
#   - `approved` is tri-state: NULL = awaiting review, true/false = decided.
#
# Adding a query: PR to this file. If it needs a column the views don't
# expose, extend nutrition-data-ops/db/sqls/dietitian_read_surface.sql first
# (create_view re-run) — the schema stays the allowlist.

queries:
  score_status:
    description: >
      Per-product scoring lifecycle for a set of product ids: current FHS,
      review-queue state (approved tri-state), approved score, publish state,
      and whether the nutrient profile passes the scorability gate.
    params:
      ids:
        type: int_list
        required: true
        max_items: 5000
        help: comma-separated ingestion_productmatch ids
    sql: |
      SELECT pm.id,
             pm.product_name,
             pm.brand_name,
             pm.source,
             pm.product_category,
             pm.fhs               AS pm_fhs,
             (inv.id IS NOT NULL) AS scorable_profile,
             sr.fhs               AS review_fhs,
             sr.approved,
             sr.date_reviewed,
             asr.fhs              AS approved_fhs,
             asr.date_approved,
             asr.published,
             asr.date_published
      FROM dietitian.ingestion_productmatch pm
      LEFT JOIN dietitian.is_nutrient_profile_valid inv ON inv.id = pm.id
      LEFT JOIN dietitian.scoring_review_scoringresult sr ON sr.product_match_id = pm.id
      LEFT JOIN dietitian.scoring_review_approvedscoringresult asr ON asr.product_match_id = pm.id
      WHERE pm.id = ANY(%(ids)s)
      ORDER BY pm.id

  approval_queue:
    description: >
      Scores awaiting review (approved IS NULL), newest first — the working
      queue for a review session. Optionally filtered to one source.
    params:
      source:
        type: str
        default: ""
        help: exact ingestion_productmatch.source to filter on (optional)
      limit:
        type: int
        default: 200
        max: 1000
    sql: |
      SELECT sr.product_match_id,
             sr.product_name,
             pm.brand_name,
             pm.source,
             sr.gtin_upc,
             sr.category,
             sr.fhs,
             sr.created_at
      FROM dietitian.scoring_review_scoringresult sr
      JOIN dietitian.ingestion_productmatch pm ON pm.id = sr.product_match_id
      WHERE sr.approved IS NULL
        AND (%(source)s = '' OR pm.source = %(source)s)
      ORDER BY sr.created_at DESC
      LIMIT %(limit)s

  recent_approvals:
    description: >
      Recently approved scores with publish state. NOTE date_approved is
      auto_now (moves on any row update) — treat windows as approximate.
    params:
      days:
        type: int
        default: 7
        max: 90
      limit:
        type: int
        default: 500
        max: 5000
    sql: |
      SELECT asr.product_match_id,
             asr.product_name,
             pm.source,
             asr.gtin_upc,
             asr.fhs,
             asr.date_approved,
             asr.published,
             asr.date_published
      FROM dietitian.scoring_review_approvedscoringresult asr
      JOIN dietitian.ingestion_productmatch pm ON pm.id = asr.product_match_id
      WHERE asr.date_approved >= now() - make_interval(days => %(days)s)
      ORDER BY asr.date_approved DESC
      LIMIT %(limit)s

  unsent_approved:
    description: >
      Approved scores that have NOT been published to clients yet
      (published = false) — the send backlog, oldest approval first.
    params:
      source:
        type: str
        default: ""
        help: exact source to filter on (optional)
      limit:
        type: int
        default: 500
        max: 5000
    sql: |
      SELECT asr.product_match_id,
             asr.product_name,
             pm.source,
             asr.gtin_upc,
             asr.fhs,
             asr.date_approved
      FROM dietitian.scoring_review_approvedscoringresult asr
      JOIN dietitian.ingestion_productmatch pm ON pm.id = asr.product_match_id
      WHERE asr.published = false
        AND (%(source)s = '' OR pm.source = %(source)s)
      ORDER BY asr.date_approved ASC
      LIMIT %(limit)s

  source_counts:
    description: >
      Scoring-funnel aggregate per source: products, scorable profiles,
      awaiting review, approved, published. Whole-table aggregate — slower;
      use the source param when you only care about one source.
    timeout_s: 300
    params:
      source:
        type: str
        default: ""
        help: exact source to filter on (optional; '' = all sources)
      limit:
        type: int
        default: 100
        max: 500
    sql: |
      SELECT pm.source,
             COUNT(*)                                          AS products,
             COUNT(inv.id)                                     AS scorable_profiles,
             COUNT(sr.id) FILTER (WHERE sr.approved IS NULL)   AS awaiting_review,
             COUNT(sr.id) FILTER (WHERE sr.approved)           AS approved_in_review,
             COUNT(asr.id)                                     AS approved_rows,
             COUNT(asr.id) FILTER (WHERE asr.published)        AS published
      FROM dietitian.ingestion_productmatch pm
      LEFT JOIN dietitian.is_nutrient_profile_valid inv ON inv.id = pm.id
      LEFT JOIN dietitian.scoring_review_scoringresult sr ON sr.product_match_id = pm.id
      LEFT JOIN dietitian.scoring_review_approvedscoringresult asr ON asr.product_match_id = pm.id
      WHERE (%(source)s = '' OR pm.source = %(source)s)
      GROUP BY pm.source
      ORDER BY products DESC
      LIMIT %(limit)s

  product_lookup:
    description: >
      Find products by GTIN or UPC (tries the value as given AND zero-stripped
      — GTIN/UPC zero-padding differs by source). Returns identity, category,
      score, and scorability.
    params:
      code:
        type: str
        required: true
        help: GTIN or UPC, with or without leading zeros
      limit:
        type: int
        default: 50
        max: 200
    sql: |
      SELECT pm.id,
             pm.product_name,
             pm.brand_name,
             pm.source,
             pm.gtin,
             pm.upc,
             pm.product_category,
             pm.fhs,
             pm.is_scorable,
             (inv.id IS NOT NULL) AS scorable_profile,
             pm.updated_at
      FROM dietitian.ingestion_productmatch pm
      LEFT JOIN dietitian.is_nutrient_profile_valid inv ON inv.id = pm.id
      WHERE pm.gtin IN (%(code)s, ltrim(%(code)s, '0'))
         OR pm.upc  IN (%(code)s, ltrim(%(code)s, '0'))
      ORDER BY pm.updated_at DESC
      LIMIT %(limit)s

  scorability_check:
    description: >
      Read-only preflight for a set of ids: does each product exist, have a
      valid nutrient profile, ingredients text, and a category — and where is
      it in review? Use before asking eng to run a scoring chain.
    params:
      ids:
        type: int_list
        required: true
        max_items: 5000
    sql: |
      SELECT pm.id,
             pm.product_name,
             pm.source,
             (inv.id IS NOT NULL)                                        AS valid_profile,
             (pm.ingredients_text IS NOT NULL AND pm.ingredients_text <> '') AS has_ingredients,
             (pm.product_category IS NOT NULL AND pm.product_category <> '') AS has_category,
             sr.approved,
             asr.published
      FROM dietitian.ingestion_productmatch pm
      LEFT JOIN dietitian.is_nutrient_profile_valid inv ON inv.id = pm.id
      LEFT JOIN dietitian.scoring_review_scoringresult sr ON sr.product_match_id = pm.id
      LEFT JOIN dietitian.scoring_review_approvedscoringresult asr ON asr.product_match_id = pm.id
      WHERE pm.id = ANY(%(ids)s)
      ORDER BY pm.id

  ingestion_status:
    description: >
      Client-ingestion pipeline rows (ingestion_foringestion) by vendor and/or
      status. Statuses are capitalized: Pending, Processing, Completed,
      Failed, Published.
    params:
      vendor_code:
        type: str
        default: ""
        help: exact vendor_code to filter on (optional)
      status:
        type: str
        default: ""
        help: "one of: Pending, Processing, Completed, Failed, Published (optional)"
      limit:
        type: int
        default: 200
        max: 2000
    sql: |
      SELECT id,
             client_id,
             vendor_code,
             product_name,
             brand_name,
             upc,
             gtin,
             ingestion_status,
             created_at,
             queued_at
      FROM dietitian.ingestion_foringestion
      WHERE (%(vendor_code)s = '' OR vendor_code = %(vendor_code)s)
        AND (%(status)s = '' OR ingestion_status = %(status)s)
      ORDER BY created_at DESC
      LIMIT %(limit)s

  score_qa:
    description: >
      Full scoring-QA breakdown for a set of products — everything that can
      affect the FHS score in one read-out: the score + sub-scores, the
      per-nutrient norms (how each input contributed), the raw macro inputs
      (+ imputed variants), all is_* tag evaluations, ingredients, serving,
      and the category range. Score + norms come from the approved result if
      one exists, else the in-review result. Wide by design — the full rows
      land in the CSV; only a sample prints. Use when a dietitian is QA'ing
      why a product scored the way it did.
    params:
      ids:
        type: int_list
        required: true
        max_items: 5000
        help: comma-separated ingestion_productmatch ids to QA
    sql: |
      SELECT pm.id,
             pm.product_name,
             pm.brand_name,
             pm.source,
             pm.gtin,
             pm.upc,
             pm.product_category,
             COALESCE(asr.category_lower_bound, sr.category_lower_bound) AS category_lower_bound,
             COALESCE(asr.category_upper_bound, sr.category_upper_bound) AS category_upper_bound,
             -- lifecycle context
             pm.fhs                          AS pm_fhs,
             sr.approved,
             (asr.id IS NOT NULL)            AS is_approved,
             asr.published,
             -- the score being QA'd (approved if present, else in-review)
             COALESCE(asr.fhs, sr.fhs)                    AS score_fhs,
             COALESCE(asr.nds, sr.nds)                    AS nds,
             COALESCE(asr.nbs, sr.nbs)                    AS nbs,
             COALESCE(asr.iqm, sr.iqm)                    AS iqm,
             COALESCE(asr.scaled_ratio, sr.scaled_ratio)  AS scaled_ratio,
             -- per-nutrient norms: how each input contributed to the score
             COALESCE(asr.sat_fat_norm, sr.sat_fat_norm)                         AS sat_fat_norm,
             COALESCE(asr.trans_fat_norm, sr.trans_fat_norm)                     AS trans_fat_norm,
             COALESCE(asr.cholesterol_norm, sr.cholesterol_norm)                 AS cholesterol_norm,
             COALESCE(asr.sodium_norm, sr.sodium_norm)                           AS sodium_norm,
             COALESCE(asr.added_sugars_norm, sr.added_sugars_norm)               AS added_sugars_norm,
             COALESCE(asr.protein_norm, sr.protein_norm)                         AS protein_norm,
             COALESCE(asr.carbs_norm, sr.carbs_norm)                             AS carbs_norm,
             COALESCE(asr.sat_to_total_fat_norm, sr.sat_to_total_fat_norm)       AS sat_to_total_fat_norm,
             COALESCE(asr.fiber_to_carb_norm, sr.fiber_to_carb_norm)             AS fiber_to_carb_norm,
             COALESCE(asr.potassium_to_sodium_norm, sr.potassium_to_sodium_norm) AS potassium_to_sodium_norm,
             COALESCE(asr.unsat_to_sat_fat_norm, sr.unsat_to_sat_fat_norm)       AS unsat_to_sat_fat_norm,
             -- raw macro inputs (+ imputed variants the scorer falls back to)
             pm.calories, pm.calories_imputed,
             pm.total_fat, pm.total_fat_imputed,
             pm.sat_fat, pm.trans_fat, pm.unsat_fat,
             pm.cholesterol, pm.sodium,
             pm.carbs, pm.carbs_imputed,
             pm.dietary_fiber, pm.total_sugars,
             pm.added_sugars, pm.added_sugars_imputed,
             pm.protein, pm.protein_imputed,
             pm.potassium,
             -- serving basis
             pm.serving_qty, pm.serving_size, pm.serving_unit, pm.serving_weight_grams,
             -- all score-affecting tag evaluations
             pm.is_carmine, pm.is_artificial_red_color, pm.is_artificial_colors,
             pm.is_potassium_bromate, pm.is_ph_oil, pm.is_aspartame,
             pm.is_acesulfame_potassium, pm.is_brominated_vegetable_oil, pm.is_caffeine,
             pm.is_saccharin, pm.is_caregeenan, pm.is_mercury_fish,
             pm.is_artificial_sweeteners, pm.is_phosphate_additives, pm.is_guar_gum,
             pm.is_polysorbate60, pm.is_propylene_glycol, pm.is_xanthan_gum, pm.is_msg,
             pm.is_titanium_dioxide, pm.is_corn_syrup, pm.is_artificial_flavors,
             pm.is_artificial_preservatives, pm.is_sulfites, pm.is_sugars_added,
             pm.is_salt_added, pm.is_omega_three, pm.is_whole_grain, pm.is_gluten,
             pm.is_refined_grains, pm.is_seed_oil, pm.is_deep_fried, pm.is_healthy_oils,
             pm.is_natural_non_kcal_sweeteners, pm.is_natural_additives,
             pm.is_unspecific_ingredient, pm.is_propellant, pm.is_starch,
             pm.is_active_live_cultures, pm.is_juice_concentrate,
             pm.ingredients_text
      FROM dietitian.ingestion_productmatch pm
      LEFT JOIN dietitian.scoring_review_approvedscoringresult asr ON asr.product_match_id = pm.id
      LEFT JOIN dietitian.scoring_review_scoringresult sr ON sr.product_match_id = pm.id
      WHERE pm.id = ANY(%(ids)s)
      ORDER BY pm.id
